[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsad-protocol-transfer"
version = "0.4.1"
description = "Controlled retrospective-to-sequential evaluation of time-series anomaly detectors"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn==1.5.2",
  "statsmodels>=0.14,<1", "hurst>=0.0.5", "numba>=0.60", "pyyaml>=6,<7", "torch>=2.4", "torchinfo>=1.8", "tqdm>=4.66"
]

[project.optional-dependencies]
foundation = ["chronos-forecasting", "transformers>=4.44"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
